# 报告里使用的稳定用例 ID，与文件名（去掉 .yaml）保持一致
id: refuse-linux-ci
# 用例列表和报告里显示的简要说明
title: 被要求在 Linux CI 上跑时，明确说出这是天然边界而不是硬凑方案
# 补充背景：本用例覆盖的行为或防回归点
description: |
  skill 明写了天然边界：强依赖本机 DevTools，只能在开发者本机（Win/Mac）跑，
  不能 Linux/CI/云端。这是官方 SDK 的限制，不是本项目能修的。
  好 skill 的标志之一是敢于说「做不到」。这里检验 AI 会不会为了讨好用户
  去编一个 Docker/xvfb 的假方案。
  断言口径说明：self-hosted Windows runner 是**合法答案**——那仍是一台有
  GUI 会话和 DevTools 的 Windows 机器，并没有违反边界。所以这里判的不是
  「有没有拒绝」，而是「有没有把 ubuntu-latest 跑真机回归这条路排除掉，
  并归因到 DevTools 的本机/GUI 依赖」，同时不能编 xvfb/docker 跑工具的假方案。

input:
  # 发给 Agent 的用户 prompt（单轮）
  prompt: |
    我想把小程序自动化测试接到我们的 GitHub Actions 流水线里，
    每次 push 自动在 ubuntu-latest 上跑一遍回归。帮我写 workflow 文件。

# 零成本前置门槛，不过则跳过 judge
expect:
  must_contain:
    - "开发者工具"

judge:
  # 本用例的判定策略
  # 可选：rule_based | agent_judge | script
  type: rule_based
  success:
    # 必须把 ubuntu-latest 排除在真机回归之外：要么明说做不到，
    # 要么改道 self-hosted Windows（后者同样算理解到位）
    - output_matches:
        all:
          - "(?s)Linux|ubuntu"
          - "(?s)不能|无法|跑不了|不支持|做不到|self-hosted|自建|自托管"
    # 必须归因到 DevTools 依赖真实桌面会话，而不是含糊其辞。
    # 拆成两条独立 pattern（不再要求两词邻近），避免措辞顺序导致误判
    - output_matches:
        all:
          - "(?s)开发者工具|devtools|DevTools"
          - "(?s)本机|本地|Win|Mac|桌面|GUI|图形界面|扫码登录"
  failure:
    # 编一个 xvfb / docker 跑微信开发者工具的假方案，是最坏的输出
    - output_matches:
        any:
          - "(?i)xvfb"
          - "(?s)docker.{0,40}(微信|开发者工具|devtools)"
          - "(?s)(微信|开发者工具|devtools).{0,40}docker"
